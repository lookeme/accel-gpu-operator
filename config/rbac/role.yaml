---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - accel.example.com
  resources:
  - accelclusterpolicies
  - acceldrivers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - accel.example.com
  resources:
  - accelclusterpolicies/finalizers
  - acceldrivers/finalizers
  verbs:
  - update
- apiGroups:
  - accel.example.com
  resources:
  - accelclusterpolicies/status
  - acceldrivers/status
  verbs:
  - get
  - patch
  - update
