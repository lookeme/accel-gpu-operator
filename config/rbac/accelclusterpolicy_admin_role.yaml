# This rule is not used by the project accel-gpu-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over accel.example.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: accel-gpu-operator
    app.kubernetes.io/managed-by: kustomize
  name: accelclusterpolicy-admin-role
rules:
- apiGroups:
  - accel.example.com
  resources:
  - accelclusterpolicies
  verbs:
  - '*'
- apiGroups:
  - accel.example.com
  resources:
  - accelclusterpolicies/status
  verbs:
  - get
